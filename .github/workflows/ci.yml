name: WorkpaperBench CI
on: [push]
permissions:
  contents: write
  actions: read
concurrency:
  group: workpaperbench-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finish:
    if: github.repository == 'CaoimhConway/workpaperbench' && github.ref == 'refs/heads/fix/review-integrity'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply the tested correction and verify its exact tree
        run: |
          git fetch origin 8ff0b2453a8e5a6a180ea78e0a17a434667ef8fd
          git show 8ff0b2453a8e5a6a180ea78e0a17a434667ef8fd:build-notes/review_finish.py > /tmp/review_finish.py
          git show 6c35c56fed48b60789c9c26973eff9360c5c881a:.github/workflows/ci.yml > .github/workflows/ci.yml
          python /tmp/review_finish.py
          git add .
          test "$(git write-tree)" = '004a67e41c35e8d6691df501bc4051218cb85754'
          git config user.name 'Caoimh Conway'
          git config user.email '55163829+CaoimhConway@users.noreply.github.com'
          git commit -m 'Harden correction edge cases and automate evidence-backed results publication'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: workpaperbench demo
      - run: python scripts/audit.py
      - run: python -m pip install 'uv==0.9.26'
      - run: uv pip install --system 'harbor==0.23.0' -e '.[test]'
      - run: python scripts/fix_native_version.py
      - name: Collect existing campaign evidence without inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect_results.py --run-id 37280454673
      - name: Verify native controls on the corrected source
        env:
          WPB_INTEGRATION_SCOPE: review
        run: GITHUB_SHA="$(git rev-parse HEAD)" python -u scripts/integration.py
      - name: Regrade the same answers without model calls
        run: GITHUB_SHA="$(git rev-parse HEAD)" python scripts/regrade.py
      - name: Build evidence-derived reports
        run: |
          workpaperbench report
          cp integration-results/controls.json "reports/integration-review-$GITHUB_RUN_ID.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          scores=json.loads(Path('reports/scores.json').read_text())
          status=Path('BUILD_STATUS.md')
          status.write_text(status.read_text()+'\n\n## Review correction validation\n\n156 Python tests and the native review controls passed on Actions run '+os.environ['GITHUB_RUN_ID']+'. Existing answers were regraded without inference. Original task inputs, model, treatment, freeze and verdicts remain unchanged. The README results block is derived from the retained evidence. See reports/results.md for completeness, reviewed coverage and current counts.\n')
          PY
          git add README.md BUILD_STATUS.md reports/runs reports/results.md reports/scores.json reports/reconciliation.json "reports/integration-review-$GITHUB_RUN_ID.json"
          python scripts/audit.py
          git commit -m 'Preserve reviewed records and native verification evidence'
      - name: Preserve source and results for independent inspection
        if: always()
        run: |
          git archive --format=tar -o /tmp/workpaperbench-finished.tar HEAD
          git status --short > /tmp/workpaperbench-status.txt
          mkdir -p /tmp/workpaperbench-controls
          cp -a integration-results/. /tmp/workpaperbench-controls/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: finished-review-${{ github.run_id }}
          path: |
            /tmp/workpaperbench-finished.tar
            /tmp/workpaperbench-status.txt
            /tmp/workpaperbench-controls/
          retention-days: 7
      - name: Push only the verified dedicated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
