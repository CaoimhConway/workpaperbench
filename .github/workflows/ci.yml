name: WorkpaperBench CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        type: boolean
        default: true
      capture:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: workpaperbench-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: workpaperbench demo
      - run: python scripts/audit.py
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Inspect hosted Docker runtime
        run: |
          docker version
          docker compose version
          free -m
          df -h
      - run: python -m pip install 'harbor==0.23.0' -e '.[test]'
      - name: Native reference and isolation controls
        run: python scripts/integration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-results/*.json
          retention-days: 7
  capture:
    if: github.event_name == 'workflow_dispatch' && inputs.capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Acquire the fixed historical window
        run: python scripts/capture_logs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: capture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capture/*.json
          retention-days: 7
