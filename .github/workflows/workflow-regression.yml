name: Workflow regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Inspect Docker runtime
        run: |
          docker version
          docker compose version
      - name: Install pinned harness and project dependencies
        run: python -m pip install 'harbor==0.23.0' -e .
      - name: Check current references and native agent transport
        run: python -u scripts/workflow_regression.py --output integration-results/workflow-v15/regression.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workflow-regression-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-results/workflow-v15/regression.json
          retention-days: 7
