minimumLimaVersion: 2.2.0
vmType: vz
os: Linux
arch: x86_64
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64
    digest: sha256:6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2
cpus: 6
memory: 12GiB
disk: 40GiB
mounts: []
ssh:
  localPort: 0
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
containerd:
  system: false
  user: false
networks:
  - vzNAT: true
hostResolver:
  enabled: false
propagateProxyEnv: false
user:
  name: wpb
  home: /home/wpb
  shell: /bin/bash
  uid: 1000
  passwordlessSudo: true
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y ca-certificates curl git python3 python3-venv docker.io docker-compose-v2 docker-buildx socat nftables
      usermod -aG docker wpb
      systemctl enable --now docker
      touch /etc/workpaperbench-local-profile
probes:
  - mode: readiness
    description: Separate benchmark guest with no host mounts
    script: |
      #!/bin/bash
      set -euo pipefail
      sudo docker info >/dev/null
      test ! -d /Users
portForwards:
  - guestIP: 0.0.0.0
    guestIPMustBeZero: true
    guestPortRange: [1, 65535]
    hostIP: 127.0.0.1
    hostPortRange: [1, 65535]
    ignore: true
